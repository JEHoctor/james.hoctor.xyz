on: push
# Every job runs on the runner's node24 label, which is node:24-bookworm. Two jobs cannot use the
# runner's docker label (node:20-bullseye): code-quality needs git 2.31 or later for pre-commit, and
# deploy installs rsync with apt, which no longer works on bullseye.
jobs:
  quality:
    name: code-quality
    runs-on: node24
    steps:
      - name: checkout
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 = v4.4.0+backports
      - name: setup uv
        uses: https://github.com/astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true
          prune-cache: false
      - name: run pre-commit checks
        run: uv run --group=dev pre-commit run --all-files
      - name: run tests
        run: uv run --group=dev --group=automation pytest
  build:
    name: build
    needs: quality
    runs-on: node24
    steps:
      - name: checkout
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 = v4.4.0+backports
      - name: setup uv
        uses: https://github.com/astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true
          prune-cache: false
      - name: build
        run: uv run --group=dev just publish
      - name: upload-artifacts
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e  # v4 = v4.3.1+patch
        with:
          name: web-content-${{ github.sha }}
          path: |
            output/
            !**/.gitkeep
          if-no-files-found: error
  validate:
    name: validate
    # Needs build for the artifact, but nothing needs validate. A failure here shows as a red mark
    # and never holds up a deployment: deploy waits on build alone.
    needs: build
    runs-on: node24
    steps:
      - name: checkout
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 = v4.4.0+backports
      - name: download-artifacts
        uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e  # v4 = v4.1.4+patch
        with:
          name: web-content-${{ github.sha }}
          path: output
      - name: setup uv
        uses: https://github.com/astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true
          prune-cache: false
      - name: install node dependencies
        run: npm ci
      - name: validate
        run: uv run --group=dev just validate
  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: node24
    steps:
      - name: download-artifacts
        uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e  # v4 = v4.1.4+patch
        with:
          name: web-content-${{ github.sha }}
          path: output
      - name: setup rsync
        id: rsync
        run: |
          apt-get -qq update
          apt-get -qq install rsync
          (umask 077 && touch deploy_id)
          echo "${{ secrets.DEPLOY_KEY }}" > deploy_id
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" >> /etc/ssh/ssh_known_hosts
      - name: deploy
        run: |
          rsync -rvz --checksum --delete -e "ssh -i deploy_id" output/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:
  mirror:
    name: mirror
    runs-on: node24
    steps:
      - name: checkout
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 = v4.4.0+backports
        with:
          ref: main
          fetch-depth: 0
      - name: setup uv
        uses: https://github.com/astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true
          prune-cache: false
      - name: mirror-redacted
        # Through just, so that this job (which always runs main's checkout, see below) uses main's
        # own idea of how the mirror is invoked, and a branch that changes that cannot break it.
        run: uv run --group=dev just mirror-redacted
        env:
          MIRROR_ACCESS_URL: ${{ secrets.MIRROR_ACCESS_URL }}
          SECRET_MAILMAP: ${{ secrets.SECRET_MAILMAP }}
  mirror-preview:
    name: mirror-preview
    runs-on: node24
    # The mirror job above runs main's checkout, so a change to the mirroring script or to post
    # metadata is only exercised for real after it merges. This job runs the *pushed branch's*
    # checkout in --dry-run mode against a read-only clone of the public mirror, so the log shows
    # what the mirror would publish if this branch were main. It is meant to be read, not to gate:
    # it fails only if the script errors or refuses, and a reviewer compares its "Publishing" and
    # "newly publishes" lines with what the pull request claims to do (see CLAUDE.md).
    if: github.ref != 'refs/heads/main'
    steps:
      - name: checkout
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 = v4.4.0+backports
        with:
          fetch-depth: 0
      - name: setup uv
        uses: https://github.com/astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true
          prune-cache: false
      - name: mirror-preview
        run: uv run --group=dev just mirror-preview
        env:
          # The public, token-less URL: this run only clones from it and prints the push.
          MIRROR_ACCESS_URL: https://github.com/JEHoctor/james.hoctor.xyz.git
          # The real mailmap, so that the summary's changed/unchanged branch hashes are meaningful.
          SECRET_MAILMAP: ${{ secrets.SECRET_MAILMAP }}
          GIT_TERMINAL_PROMPT: "0"
