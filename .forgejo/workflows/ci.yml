on: push
jobs:
  quality:
    name: code-quality
    runs-on: docker
    # The runner defaults to a Debian bullseye image, whose git is 2.30. pre-commit shells out to
    # "git ls-files --deduplicate", an option added in git 2.31, so --all-files cannot work there.
    # Bookworm ships git 2.39. Pulled from the registry the runner already uses by default.
    container:
      image: data.forgejo.org/oci/node:20-bookworm
    steps:
      - name: checkout
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 = v4.4.0+backports
      - name: setup uv
        uses: https://github.com/astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true
          prune-cache: false
      - name: run ShellCheck and shfmt
        run: |
          uv run --group=dev shfmt -d **/*.sh
          uv run --group=dev shellcheck **/*.sh
      - name: run pre-commit checks
        run: SKIP="shellcheck,shfmt" uv run --group=dev pre-commit run --all-files
  build:
    name: build
    needs: quality
    runs-on: docker
    steps:
      - name: checkout
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 = v4.4.0+backports
      - name: setup uv
        uses: https://github.com/astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true
          prune-cache: false
      - name: build
        run: uv run --group=dev just publish
      - name: upload-artifacts
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e  # v4 = v4.3.1+patch
        with:
          name: web-content-${{ github.sha }}
          path: |
            output/
            !**/.gitkeep
          if-no-files-found: error
  validate:
    name: validate
    # Needs build for the artifact, but nothing needs validate. A failure here shows as a red mark
    # and never holds up a deployment: deploy waits on build alone.
    #
    # The runner's default node:20-bullseye image supplies node and npm, which is all htmlhint and
    # stylelint need; its old git only matters for pre-commit, which does not run here.
    needs: build
    runs-on: docker
    steps:
      - name: checkout
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 = v4.4.0+backports
      - name: download-artifacts
        uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e  # v4 = v4.1.4+patch
        with:
          name: web-content-${{ github.sha }}
          path: output
      - name: setup uv
        uses: https://github.com/astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true
          prune-cache: false
      - name: install node dependencies
        run: npm ci
      - name: validate
        run: uv run --group=dev just validate
  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: docker
    steps:
      - name: download-artifacts
        uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e  # v4 = v4.1.4+patch
        with:
          name: web-content-${{ github.sha }}
          path: output
      - name: setup rsync
        id: rsync
        run: |
          apt-get -qq update
          apt-get -qq install rsync
          (umask 077 && touch deploy_id)
          echo "${{ secrets.DEPLOY_KEY }}" > deploy_id
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" >> /etc/ssh/ssh_known_hosts
      - name: deploy
        run: |
          rsync -rvz --delete -e "ssh -i deploy_id" output/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:
  mirror:
    name: mirror
    runs-on: docker
    steps:
      - name: checkout
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 = v4.4.0+backports
        with:
          ref: main
          fetch-depth: 0
      - name: setup uv
        uses: https://github.com/astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true
          prune-cache: false
      - name: mirror-redacted
        # Invoked directly rather than through just, because this job checks out main and main will
        # not have a justfile until this branch is merged.
        run: uv run --group=automation ./automation/mirror-redacted.py
        env:
          MIRROR_ACCESS_URL: ${{ secrets.MIRROR_ACCESS_URL }}
          SECRET_MAILMAP: ${{ secrets.SECRET_MAILMAP }}
  mirror-preview:
    name: mirror-preview
    runs-on: docker
    # The mirror job above runs main's checkout, so a change to the mirroring script or to post
    # metadata is only exercised for real after it merges. This job runs the *pushed branch's*
    # checkout in --dry-run mode against a read-only clone of the public mirror, so the log shows
    # what the mirror would publish if this branch were main. It is meant to be read, not to gate:
    # it fails only if the script errors or refuses, and a reviewer compares its "Publishing" and
    # "newly publishes" lines with what the pull request claims to do (see CLAUDE.md).
    if: github.ref != 'refs/heads/main'
    steps:
      - name: checkout
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 = v4.4.0+backports
        with:
          fetch-depth: 0
      - name: setup uv
        uses: https://github.com/astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true
          prune-cache: false
      - name: mirror-redacted --dry-run
        run: uv run --group=automation ./automation/mirror-redacted.py --dry-run
        env:
          # The public, token-less URL: this run only clones from it and prints the push.
          MIRROR_ACCESS_URL: https://github.com/JEHoctor/james.hoctor.xyz.git
          # The real mailmap, so that the summary's changed/unchanged branch hashes are meaningful.
          SECRET_MAILMAP: ${{ secrets.SECRET_MAILMAP }}
          GIT_TERMINAL_PROMPT: "0"
