[project]
name = "james-hoctor-xyz"
version = "0.1.0"
description = "Static site generation for james.hoctor.xyz powered by Pelican"
readme = "readme.md"
requires-python = ">=3.13"
dependencies = [
    "pelican-render-math>=1.0.4",
    "pelican-seo>=1.4.0",
    "pelican-sitemap>=1.2.2",
    "pelican[markdown]>=4.11.0",
]

[dependency-groups]
automation = [
    "git-filter-repo>=2.47.0",
    "rich>=14.0.0",
    "typer>=0.24.1",
]
dev = [
    "ipython>=9.11.0",
    "nbconvert>=7.17.0",
    "nbdime>=4.0.4",
    "nbqa>=1.9.1",
    "pre-commit>=4.5.1",
    "ruff>=0.15.6",
    "rust-just>=1.49.0",
    "shellcheck-py>=0.11.0.1",
    "shfmt-py>=3.12.0.2",
    "ty>=0.0.23",
]
notebook = [
    "ipywidgets>=8.1.8",
    "jupyter-ruff>=0.3.1",
    "jupyterlab>=4.5.6",
    "jupyterlab-lsp>=5.2.0",
    "jupyterlab-vim>=4.1.4",
    "more-itertools>=11.0.2",
    "pandas>=3.0.1",
    "pandas-stubs>=3.0.0.260204",
    "pylsp-mypy>=0.7.1",
    "pymoo>=0.6.1.6",
    "python-lsp-ruff>=2.3.0",
    "ruff>=0.15.6",
    "tqdm>=4.67.3",
]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501",      # Handled by ruff format (line-too-long)
    "D100",      # undocumented-public-module
    "D104",      # undocumented-public-package
    "D203",      # Conflicts with Google style D211/D212
]

[tool.ruff.lint.per-file-ignores]
"automation/*" = [
    "INP001",    # No need to create __init__.py files in the automation/ directory.
]
"{pelican,publish}conf.py" = [
    "ERA001",    # These are conf files and sometimes config settings are commented out.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
show_error_codes = true
warn_unused_ignores = true
