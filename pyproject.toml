[project]
name = "james-hoctor-xyz"
version = "0.1.0"
description = "Static site generation for james.hoctor.xyz powered by Pelican"
readme = "readme.md"
requires-python = ">=3.13"
dependencies = [
    "pelican-pandoc-reader>=3.0.2",
    "pelican-seo>=1.4.0",
    "pelican-sitemap>=1.2.2",
    "pelican[markdown]>=4.11.0",
    "pypandoc-binary>=1.17",
]

[dependency-groups]
automation = [
    # The `blog` command (post and mirror subcommands): a workspace member under automation/.
    "blog-automation",
]
dev = [
    "ipython>=9.11.0",
    "nbconvert>=7.17.0",
    "nbdime>=4.0.4",
    "nbqa>=1.9.1",
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
    "ruff==0.16.7",
    "rust-just>=1.49.0",
    "ty>=0.0.23",
]
notebook = [
    "ipywidgets>=8.1.8",
    "jupyter-ruff>=0.3.1",
    "jupyterlab>=4.5.6",
    "jupyterlab-lsp>=5.2.0",
    "jupyterlab-vim>=4.1.4",
    "more-itertools>=11.0.2",
    "pandas>=3.0.1",
    "pandas-stubs>=3.0.0.260204",
    "pylsp-mypy>=0.7.1",
    "pymoo>=0.6.1.6",
    "python-lsp-ruff>=2.3.0",
    "ruff==0.16.7",
    "tqdm>=4.67.3",
]

[tool.uv.workspace]
members = ["automation"]

[tool.uv.sources]
blog-automation = { workspace = true }

[tool.ruff]
line-length = 120
indent-width = 4
# .claude/worktrees/ holds separate git checkouts, not part of this source tree.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501",      # Handled by ruff format (line-too-long)
    "D100",      # undocumented-public-module
    "D104",      # undocumented-public-package
    "D203",      # Conflicts with Google style D211/D212
    "CPY001",    # missing-copyright-notice; a personal blog does not want copyright headers
]

[tool.ruff.lint.per-file-ignores]
"automation/src/blog_automation/{mirror,repo}.py" = [
    "S603",      # Every subprocess call is a literal git/git-filter-repo argv with no shell.
    "S607",      # ... invoked by bare name on purpose, so the environment's git is used.
]
"{tests,automation/tests}/*" = [
    "S101",      # assert is how pytest tests assert.
    "INP001",    # tests/ is not a package.
    "D103",      # Test names are the documentation.
]
"{pelican,publish}conf.py" = [
    "ERA001",    # These are conf files and sometimes config settings are commented out.
]

[tool.pytest.ini_options]
testpaths = ["tests", "automation/tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
show_error_codes = true
warn_unused_ignores = true
